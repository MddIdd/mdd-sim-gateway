name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: control/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y swig libpcsclite-dev
      - run: pip install -r control/requirements.txt
      - run: python -m py_compile control/app/*.py engine/*.py host/*.py
      - run: python -m unittest discover -s tests -v
      - run: sh -n install.sh engine/entrypoint.sh turn/entrypoint.sh tools/engine-fingerprint.sh

  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No real subscriber identifiers in the tree
        # RELEASE_CHECKLIST.md has always required this scan, but as a manual step it was
        # skipped for fifteen consecutive releases. Enforced here so it cannot be.
        # Invoked through sh: tools/ scripts are tracked without the executable bit,
        # matching the other scripts in that directory.
        run: sh tools/check-subscriber-identifiers.sh

  webui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
      - run: npm run build
      # npm audit calls the public registry, which intermittently returns 503 from its audit
      # endpoint. A transient registry outage must not fail CI, but a real high-severity
      # advisory still must. Retry a few times; only tolerate a failure whose output shows the
      # registry itself was unavailable (never a genuine advisory).
      - name: npm audit (tolerate registry outages)
        run: |
          for attempt in 1 2 3; do
            out="$(npm audit --audit-level=high 2>&1)" && { echo "$out"; exit 0; }
            echo "$out"
            if printf '%s' "$out" | grep -qiE 'Service Unavailable|audit endpoint returned an error|ETIMEDOUT| ECONNRESET|EAI_AGAIN|503'; then
              echo "::warning::npm audit registry unavailable (attempt $attempt/3)"
              sleep $((attempt * 15))
              continue
            fi
            echo "::error::npm audit reported a high-severity advisory"
            exit 1
          done
          echo "::warning::npm audit skipped — registry unavailable after 3 attempts"

  control-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build control image
        run: docker build -f control/Dockerfile -t mdd-sim-gateway/control:ci .

  engine-image:
    name: Engine image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both architectures ship exactly what engine/asterisk-keep-modules.txt names: the
          # build prunes everything else and fails unless the survivors equal the list, so the
          # counts no longer differ by the x86-only external binary modules. Asserting it again
          # here is what proves the published image is the one the build checked.
          - arch: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
            modules: 126
          - arch: amd64
            runner: ubuntu-latest
            machine: x86_64
            modules: 126
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and validate the native Engine image
        run: |
          runtime_fp=$(sh tools/engine-fingerprint.sh runtime)
          base_fp=$(sh tools/engine-fingerprint.sh base)
          docker build \
            --build-arg "MDD_VERSION=$(cat VERSION)" \
            --build-arg "RUNTIME_FP=$runtime_fp" \
            --build-arg "BASE_FP=$base_fp" \
            -t mdd-sim-gateway/engine:ci engine
          docker run --rm --entrypoint /bin/bash mdd-sim-gateway/engine:ci -lc '
            set -e
            actual_machine=$(uname -m)
            module_count=$(find /usr/lib/asterisk/modules -name "*.so" | wc -l)
            printf "Engine validation: architecture=%s modules=%s\n" "$actual_machine" "$module_count"
            test "$actual_machine" = "${{ matrix.machine }}"
            test "$module_count" -eq "${{ matrix.modules }}"
            python3 -c "import Crypto, cryptography, jinja2, panoramisk, requests, serial, smartcard, socks, card"
            asterisk -V
          '
