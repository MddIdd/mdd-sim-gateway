name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  engine:
    name: Engine (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both architectures ship exactly what engine/asterisk-keep-modules.txt names: the
          # build prunes everything else and fails unless the survivors equal the list, so the
          # counts no longer differ by the x86-only external binary modules. Asserting it again
          # here is what proves the published image is the one the build checked.
          - arch: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
            modules: 126
          - arch: amd64
            runner: ubuntu-latest
            machine: x86_64
            modules: 126
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag and version
        run: test "v$(tr -d '\n' < VERSION)" = "${GITHUB_REF_NAME}"
      - name: Build, validate and publish the native Engine image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          registry_image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/mdd-sim-gateway-engine"
          release_image="$registry_image:${GITHUB_REF_NAME}"
          architecture_image="$registry_image:${GITHUB_REF_NAME}-${{ matrix.arch }}"
          runtime_fp=$(sh tools/engine-fingerprint.sh runtime)
          base_fp=$(sh tools/engine-fingerprint.sh base)
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --no-cache \
            --build-arg "MDD_VERSION=$(cat VERSION)" \
            --build-arg "RUNTIME_FP=$runtime_fp" \
            --build-arg "BASE_FP=$base_fp" \
            -t "$release_image" -t "$architecture_image" engine
          docker run --rm --entrypoint /bin/bash "$release_image" -lc '
            set -e
            actual_machine=$(uname -m)
            module_count=$(find /usr/lib/asterisk/modules -name "*.so" | wc -l)
            printf "Engine validation: architecture=%s modules=%s\n" "$actual_machine" "$module_count"
            test "$actual_machine" = "${{ matrix.machine }}"
            test "$module_count" -eq "${{ matrix.modules }}"
            python3 -c "import Crypto, cryptography, jinja2, panoramisk, requests, serial, smartcard, socks, card"
            asterisk -V
          '
          docker push "$architecture_image"
          engine_archive="mdd-sim-gateway-engine-${GITHUB_REF_NAME}-${{ matrix.arch }}.tar"
          docker save --output "$engine_archive" "$release_image"
          gzip -1 "$engine_archive"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-image-${{ matrix.arch }}
          path: mdd-sim-gateway-engine-v*-${{ matrix.arch }}.tar.gz
          compression-level: 0
          if-no-files-found: error

  control:
    name: Control (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag and version
        run: test "v$(tr -d '\n' < VERSION)" = "${GITHUB_REF_NAME}"
      - name: Build native control image asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          registry_image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/mdd-sim-gateway-control"
          architecture_image="$registry_image:${GITHUB_REF_NAME}-${{ matrix.arch }}"
          image_tar="mdd-sim-gateway-control-${GITHUB_REF_NAME}-${{ matrix.arch }}.tar"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --no-cache \
            --build-arg "MDD_VERSION=$(cat VERSION)" \
            -f control/Dockerfile \
            -t mdd-sim-gateway/control \
            -t "mdd-sim-gateway/control:${GITHUB_REF_NAME}" \
            -t "$architecture_image" .
          test "$(docker image inspect mdd-sim-gateway/control --format '{{.Architecture}}')" = \
            "${{ matrix.arch }}"
          test "$(docker image inspect mdd-sim-gateway/control --format '{{index .Config.Labels "io.mdd-sim-gateway.component"}}|{{index .Config.Labels "org.opencontainers.image.version"}}')" = \
            "control|$(cat VERSION)"
          docker run --rm --entrypoint sh mdd-sim-gateway/control -c '
            docker --version
            docker compose version
            test -f /app/host/mdd_update.py
            test -f /app/host/mdd_container_update.py
          '
          docker push "$architecture_image"
          docker save --output "$image_tar" mdd-sim-gateway/control \
            "mdd-sim-gateway/control:${GITHUB_REF_NAME}"
          gzip -1 "$image_tar"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: control-image-${{ matrix.arch }}
          path: mdd-sim-gateway-control-v*-${{ matrix.arch }}.tar.gz
          compression-level: 0
          if-no-files-found: error

  runtime:
    name: Hardware and Egress (${{ matrix.arch }})
    needs: control
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag and version
        run: test "v$(tr -d '\n' < VERSION)" = "${GITHUB_REF_NAME}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: control-image-${{ matrix.arch }}
          path: .
      - name: Build, validate and publish native Hardware and Egress images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gzip -dc "mdd-sim-gateway-control-${GITHUB_REF_NAME}-${{ matrix.arch }}.tar.gz" | docker load
          python tools/container-runtime/prepare_egress_assets.py --arch "${{ matrix.arch }}"
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # relay: the optional media relay (relay media mode, control/app/media.py). Published
          # to the registry only; a gateway fetches it when the relay is switched on.
          for component in hardware egress relay; do
            registry_image="ghcr.io/$owner/mdd-sim-gateway-$component"
            architecture_image="$registry_image:${GITHUB_REF_NAME}-${{ matrix.arch }}"
            local_image="mdd-sim-gateway/$component"
            if [ "$component" = hardware ]; then
              docker build --no-cache \
                --build-arg "MDD_VERSION=$(cat VERSION)" \
                --build-arg "BASE_IMAGE=mdd-sim-gateway/control:${GITHUB_REF_NAME}" \
                -f runtime/Dockerfile.hardware \
                -t "$local_image" -t "$local_image:${GITHUB_REF_NAME}" \
                -t "$architecture_image" .
            elif [ "$component" = relay ]; then
              docker build --no-cache \
                --build-arg "MDD_VERSION=$(cat VERSION)" \
                -t "$local_image" -t "$local_image:${GITHUB_REF_NAME}" \
                -t "$architecture_image" relay
            else
              docker build --no-cache \
                --build-arg "MDD_VERSION=$(cat VERSION)" \
                --build-arg "TARGETARCH=${{ matrix.arch }}" \
                -f runtime/Dockerfile.egress \
                -t "$local_image" -t "$local_image:${GITHUB_REF_NAME}" \
                -t "$architecture_image" .
            fi
            identity=$(docker image inspect "$local_image" --format \
              '{{.Architecture}}|{{index .Config.Labels "io.mdd-sim-gateway.component"}}|{{index .Config.Labels "io.mdd-sim-gateway.managed"}}|{{index .Config.Labels "org.opencontainers.image.version"}}')
            test "$identity" = "${{ matrix.arch }}|$component|true|$(cat VERSION)"
            docker push "$architecture_image"
            [ "$component" = relay ] && continue
            image_tar="mdd-sim-gateway-$component-${GITHUB_REF_NAME}-${{ matrix.arch }}.tar"
            docker save --output "$image_tar" "$local_image" "$local_image:${GITHUB_REF_NAME}"
            gzip -1 "$image_tar"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-images-${{ matrix.arch }}
          path: |
            mdd-sim-gateway-hardware-v*-${{ matrix.arch }}.tar.gz
            mdd-sim-gateway-egress-v*-${{ matrix.arch }}.tar.gz
          compression-level: 0
          if-no-files-found: error

  driver-pack:
    name: Synology DS1621+ driver pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag and version
        run: test "v$(tr -d '\n' < VERSION)" = "${GITHUB_REF_NAME}"
      # Fails unless every module reproduces the one validated on hardware, and unless the
      # pack reproduces the checksum the compatibility catalogue pins.
      - name: Rebuild and verify the driver pack
        run: |
          set -eu
          sh tools/drivers/build-synology-pack.sh dist
          python3 tools/validate_nas_catalog.py
          expected=$(python3 -c "import json;print(json.load(open('drivers/catalog/synology-ds1621plus-dsm-7.4.1-90080-k4.4.302plus-x86_64.json'))['driver_pack']['sha256'])")
          test "$(sha256sum dist/mdd-driver-synology-ds1621plus-dsm7.4.1-90080-k4.4.302plus-x86_64.tar.gz | cut -d' ' -f1)" = "$expected"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: driver-pack
          path: dist/mdd-driver-synology-ds1621plus-dsm7.4.1-90080-k4.4.302plus-x86_64.tar.gz
          compression-level: 0
          if-no-files-found: error

  package:
    needs: [engine, control, runtime, driver-pack]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify tag and version
        run: |
          test "v$(tr -d '\n' < VERSION)" = "${GITHUB_REF_NAME}"
          git diff --exit-code
      - name: No real subscriber identifiers in the release
        run: sh tools/check-subscriber-identifiers.sh
      - name: Test release source
        run: |
          sudo apt-get update
          sudo apt-get install -y swig libpcsclite-dev
          python -m pip install -r control/requirements.txt
          python -m py_compile control/app/*.py engine/*.py host/*.py
          python -m unittest discover -s tests -v
          sh -n install.sh engine/entrypoint.sh relay/entrypoint.sh tools/engine-fingerprint.sh
          cd webui
          npm ci
          npm audit --audit-level=high
          npm run build
      - name: Validate Engine definition
        run: |
          docker build --check -f engine/Dockerfile engine
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: engine-image-*
          merge-multiple: true
          path: .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: control-image-*
          merge-multiple: true
          path: .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: runtime-images-*
          merge-multiple: true
          path: .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: driver-pack
          path: .
      - name: Publish multi-architecture image manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for component in engine control hardware egress relay; do
            registry_image="ghcr.io/$owner/mdd-sim-gateway-$component"
            docker buildx imagetools create \
              --tag "$registry_image:${GITHUB_REF_NAME}" \
              "$registry_image:${GITHUB_REF_NAME}-arm64" \
              "$registry_image:${GITHUB_REF_NAME}-amd64"
          done
      - name: Build checksummed source archive
        run: |
          archive="mdd-sim-gateway-${GITHUB_REF_NAME}.tar.gz"
          compose_asset="mdd-sim-gateway-compose-${GITHUB_REF_NAME}.yaml"
          staging="$(mktemp -d)"
          root="$staging/mdd-sim-gateway-${GITHUB_REF_NAME}"
          mkdir -p "$root"
          git archive HEAD | tar -x -C "$root"
          rm -rf "$root/webui/dist"
          cp -a webui/dist "$root/webui/dist"
          printf '%s\n' "$(cat VERSION)" > "$root/webui/dist/.mdd-release-version"
          python - "$compose_asset" <<'PY'
          import os
          import sys
          from pathlib import Path

          source = Path("runtime/compose.yaml").read_text(encoding="utf-8")
          marker = "${MDD_IMAGE_TAG:?set a release tag such as v1.12.0}"
          if source.count(marker) != 4:
              raise SystemExit("release Compose template does not contain four image markers")
          source = source.replace(marker, os.environ["GITHUB_REF_NAME"])
          source = source.replace(
              "${MDD_DATA_DIR:?set an absolute NAS data directory}",
              "/volume1/docker/mdd-sim-gateway")
          source = source.replace(
              "${MDD_ADVERTISE_ADDR:?set the NAS LAN address}",
              "192.168.1.100")
          header = """# MDD Sim Gateway full-container deployment (Docker Compose v2, Linux host).\n# Before starting, replace 192.168.1.100 with this host's LAN address, and replace\n# /volume1/docker/mdd-sim-gateway (the Synology example) with your data directory.\n# Ordinary Linux: save as docker-compose.yml in the data directory and run `docker compose up -d`.\n# Synology: paste into a new Container Manager project.\n\n"""
          Path(sys.argv[1]).write_text(
              header + source, encoding="utf-8")
          PY
          test "$(grep -c "ghcr.io/.*/mdd-sim-gateway-.*:${GITHUB_REF_NAME}" "$compose_asset")" = 4
          ! grep -F '${MDD_IMAGE_TAG' "$compose_asset"
          ! grep -F '${MDD_DATA_DIR' "$compose_asset"
          ! grep -F '${MDD_ADVERTISE_ADDR' "$compose_asset"
          docker compose -f "$compose_asset" config --quiet
          # v1.3.4's updater requires this legacy channel marker before it will apply an
          # archive. Generate it only for the hand-off release; the new installer removes it.
          if [ "$(cat VERSION)" = "1.3.5" ]; then
            printf '%s\n' public > "$root/EDITION"
          fi
          # This manifest is covered by the source archive checksum. It lets both v1.4.1's old
          # updater and a fresh official install verify the native image assets before import.
          sha256sum \
            "mdd-sim-gateway-control-${GITHUB_REF_NAME}-arm64.tar.gz" \
            "mdd-sim-gateway-control-${GITHUB_REF_NAME}-amd64.tar.gz" \
            "mdd-sim-gateway-engine-${GITHUB_REF_NAME}-arm64.tar.gz" \
            "mdd-sim-gateway-engine-${GITHUB_REF_NAME}-amd64.tar.gz" \
            "mdd-sim-gateway-hardware-${GITHUB_REF_NAME}-arm64.tar.gz" \
            "mdd-sim-gateway-hardware-${GITHUB_REF_NAME}-amd64.tar.gz" \
            "mdd-sim-gateway-egress-${GITHUB_REF_NAME}-arm64.tar.gz" \
            "mdd-sim-gateway-egress-${GITHUB_REF_NAME}-amd64.tar.gz" \
            > "$root/engine/release-image.SHA256SUMS"
          tar -czf "$archive" -C "$staging" "mdd-sim-gateway-${GITHUB_REF_NAME}"
          sha256sum "$archive" \
            "$compose_asset" \
            "mdd-sim-gateway-control-${GITHUB_REF_NAME}-arm64.tar.gz" \
            "mdd-sim-gateway-control-${GITHUB_REF_NAME}-amd64.tar.gz" \
            "mdd-sim-gateway-engine-${GITHUB_REF_NAME}-arm64.tar.gz" \
            "mdd-sim-gateway-engine-${GITHUB_REF_NAME}-amd64.tar.gz" \
            "mdd-sim-gateway-hardware-${GITHUB_REF_NAME}-arm64.tar.gz" \
            "mdd-sim-gateway-hardware-${GITHUB_REF_NAME}-amd64.tar.gz" \
            "mdd-sim-gateway-egress-${GITHUB_REF_NAME}-arm64.tar.gz" \
            "mdd-sim-gateway-egress-${GITHUB_REF_NAME}-amd64.tar.gz" \
            "mdd-driver-synology-ds1621plus-dsm7.4.1-90080-k4.4.302plus-x86_64.tar.gz" > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file=".github/release-notes/${GITHUB_REF_NAME}.md"
          test -s "$notes_file" || {
            echo "missing bilingual Release notes: $notes_file" >&2
            exit 1
          }
          release_flags=()
          case "$GITHUB_REF_NAME" in
            *-rc*|*-beta*|*-alpha*) release_flags+=(--prerelease) ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            "mdd-sim-gateway-${GITHUB_REF_NAME}.tar.gz" \
            "mdd-sim-gateway-compose-${GITHUB_REF_NAME}.yaml" \
            "mdd-sim-gateway-control-${GITHUB_REF_NAME}-arm64.tar.gz" \
            "mdd-sim-gateway-control-${GITHUB_REF_NAME}-amd64.tar.gz" \
            "mdd-sim-gateway-engine-${GITHUB_REF_NAME}-arm64.tar.gz" \
            "mdd-sim-gateway-engine-${GITHUB_REF_NAME}-amd64.tar.gz" \
            "mdd-sim-gateway-hardware-${GITHUB_REF_NAME}-arm64.tar.gz" \
            "mdd-sim-gateway-hardware-${GITHUB_REF_NAME}-amd64.tar.gz" \
            "mdd-sim-gateway-egress-${GITHUB_REF_NAME}-arm64.tar.gz" \
            "mdd-sim-gateway-egress-${GITHUB_REF_NAME}-amd64.tar.gz" \
            "mdd-driver-synology-ds1621plus-dsm7.4.1-90080-k4.4.302plus-x86_64.tar.gz" \
            SHA256SUMS \
            --verify-tag --notes-file "$notes_file" --title "MDD Sim Gateway ${GITHUB_REF_NAME}" \
            "${release_flags[@]}"
